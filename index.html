<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFTIMP - Gerador de TXT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1c1e21; min-height: 100vh; }
  header { background: #1a3c6e; color: #fff; padding: 18px 30px; }
  header h1 { font-size: 22px; }
  header p { font-size: 13px; opacity: .8; margin-top: 2px; }
  .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: #1a3c6e; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; max-width: 360px; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 15px; }
  input[type=file] { font-size: 14px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
  button { background: #1a3c6e; color: #fff; border: none; border-radius: 6px; padding: 10px 22px; font-size: 15px; cursor: pointer; }
  button:hover { background: #14508f; }
  button:disabled { background: #9aa4b1; cursor: not-allowed; }
  button.green { background: #1d7a3a; }
  button.green:hover { background: #229144; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { border: 1px solid #dde1e6; padding: 8px 10px; text-align: left; }
  th { background: #eef1f5; }
  tr.nf td { background: #fdecea; color: #b3261e; }
  .status { font-size: 13px; margin-top: 8px; }
  .ok { color: #1d7a3a; }
  .err { color: #b3261e; }
  pre { background: #0f1720; color: #d7e3f4; padding: 14px; border-radius: 8px; font-size: 13px; overflow-x: auto; max-height: 320px; }
  .hidden { display: none; }
  .badge { display: inline-block; background: #eef1f5; border-radius: 12px; padding: 2px 10px; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>SOFTIMP</h1>
  <p>Conversor de SKU (ORIGINAL &rarr; SOFT) e gerador de arquivo TXT</p>
</header>
<div class="container">

  <div class="card">
    <h2>1. Base de dados (Google Sheets)</h2>
    <div id="dbStatus" class="status">Carregando planilha...</div>
  </div>

  <div class="card">
    <h2>2. Dados do pedido</h2>
    <div class="row">
      <div>
        <label for="cnpj">CNPJ da empresa</label>
        <input type="text" id="cnpj" placeholder="Ex.: 29094628000185" maxlength="18">
      </div>
      <div>
        <label for="arquivo">Arquivo Excel (coluna SKU e coluna QUANTIDADE) &mdash; <a href="modelo.xlsx" download>baixar modelo</a></label>
        <input type="file" id="arquivo" accept=".xlsx,.xls,.csv">
      </div>
    </div>
    <div style="margin-top:16px">
      <label for="colar">Ou cole aqui (Ctrl+V) no formato: SKU e QUANTIDADE separados por espaço ou TAB, um por linha. Ex.: 4100&nbsp;&nbsp;3</label>
      <textarea id="colar" rows="6" placeholder="4100  3&#10;5435  12&#10;6965  1" style="width:100%;max-width:480px;padding:10px;border:1px solid #ccd0d5;border-radius:6px;font-size:14px;font-family:Consolas,monospace"></textarea>
    </div>
    <div style="margin-top:14px">
      <button id="btnProcessar" disabled>Processar</button>
    </div>
  </div>

  <div class="card hidden" id="cardResultado">
    <h2>3. Resultado <span class="badge" id="resumo"></span></h2>
    <table id="tabela">
      <thead>
        <tr><th>#</th><th>SKU (ORIGINAL - coluna B)</th><th>Quantidade</th><th>Código SOFT (coluna A)</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="status err" id="avisoNF"></div>
  </div>

  <div class="card hidden" id="cardTxt">
    <h2>4. Arquivo TXT</h2>
    <pre id="preview"></pre>
    <div class="row" style="margin-top:14px">
      <div>
        <label for="nomeArquivo">Nome do arquivo</label>
        <input type="text" id="nomeArquivo" value="pedido" placeholder="nome do arquivo">
      </div>
      <div>
        <button class="green" id="btnGerar">Gerar TXT e salvar</button>
      </div>
    </div>
  </div>

</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1fRqUo8vH4awjCwV12U0fhR2bdBSRGFUVMlU8PozUsoQ/gviz/tq?tqx=out:csv&gid=1382622657";
let mapa = null;      // ORIGINAL (coluna B) -> SOFT (coluna A)
let linhasTxt = [];   // linhas 2||| geradas

function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i+1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cur); cur = ""; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c !== '\r') cur += c;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

const SHEET_JSONP = "https://docs.google.com/spreadsheets/d/1fRqUo8vH4awjCwV12U0fhR2bdBSRGFUVMlU8PozUsoQ/gviz/tq?gid=1382622657&tqx=out:json;responseHandler:handleGviz";

function montarMapa(pares) {
  mapa = {};
  let n = 0;
  for (const [soft, original] of pares) {
    if (soft && original && soft !== "SOFT" && !(original in mapa)) { mapa[original] = soft; n++; }
  }
  return n;
}

function carregarViaFetch() {
  return fetch(SHEET_URL).then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(t => {
    const rows = parseCSV(t);
    return montarMapa(rows.map(r => [(r[0] || "").trim(), (r[1] || "").trim()]));
  });
}

function carregarViaJsonp() {
  return new Promise((res, rej) => {
    const timer = setTimeout(() => rej(new Error("tempo esgotado")), 20000);
    const handler = (data) => window.handleGviz(data);
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = window.google.visualization.Query || {};
    window.google.visualization.Query.setResponse = handler;
    window.handleGviz = (data) => {
      clearTimeout(timer);
      try {
        const val = c => c == null ? "" : String(c.f != null ? c.f : (c.v != null ? c.v : "")).trim();
        const pares = (data.table.rows || []).map(r => [val(r.c[0]), val(r.c[1])]);
        res(montarMapa(pares));
      } catch (e) { rej(e); }
    };
    const s = document.createElement("script");
    s.src = SHEET_JSONP;
    s.onerror = () => { clearTimeout(timer); rej(new Error("falha ao carregar script")); };
    document.head.appendChild(s);
  });
}

async function carregarBase() {
  const st = document.getElementById("dbStatus");
  let n;
  try {
    n = await carregarViaFetch();
  } catch (e1) {
    try { n = await carregarViaJsonp(); }
    catch (e2) {
      st.innerHTML = '<span class="err">Erro ao carregar a planilha (' + e1.message + ' / ' + e2.message + '). Verifique a internet e se a planilha está compartilhada como "qualquer pessoa com o link".</span>';
      return;
    }
  }
  st.innerHTML = '<span class="ok">Planilha carregada: ' + n + ' SKUs na base.</span>';
  document.getElementById("btnProcessar").disabled = false;
}
carregarBase();

function lerExcel(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = e => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" }));
      } catch (err) { rej(err); }
    };
    fr.onerror = rej;
    fr.readAsArrayBuffer(file);
  });
}

function lerColado(texto) {
  const dados = [];
  for (const linha of texto.split(/\r?\n/)) {
    const p = linha.trim().split(/[\s;,\t]+/);
    if (p.length >= 2) dados.push([p[0], p[1]]);
    else if (p[0]) dados.push([p[0], ""]);
  }
  return dados;
}

document.getElementById("btnProcessar").addEventListener("click", async () => {
  const file = document.getElementById("arquivo").files[0];
  const colado = document.getElementById("colar").value.trim();
  if (!file && !colado) { alert("Selecione o arquivo Excel OU cole os SKUs e quantidades na área de texto."); return; }
  if (!mapa) { alert("A base ainda não foi carregada."); return; }

  let dados;
  if (colado) {
    dados = lerColado(colado);
  } else {
    try { dados = await lerExcel(file); }
    catch (e) { alert("Não foi possível ler o arquivo: " + e.message); return; }
  }

  // detecta cabecalho: pula primeira linha se a quantidade nao for numerica
  let inicio = 0;
  if (dados.length && dados[0].length >= 2 && isNaN(parseFloat(String(dados[0][1]).replace(",", ".")))) inicio = 1;

  // monta lista limpa
  let itens = [];
  for (let i = inicio; i < dados.length; i++) {
    const sku = String(dados[i][0] || "").trim();
    const qtd = String(dados[i][1] || "").trim();
    if (!sku && !qtd) continue;
    itens.push([sku, qtd]);
  }

  // detecta SKUs duplicados
  const cont = {};
  for (const [sku] of itens) cont[sku] = (cont[sku] || 0) + 1;
  const dups = Object.keys(cont).filter(s => cont[s] > 1);
  if (dups.length) {
    const msg = "Atenção: há SKUs repetidos na lista:\n\n" +
      dups.map(s => "SKU " + s + " (" + cont[s] + " vezes)").join("\n") +
      "\n\nDeseja JUNTAR as quantidades para ficar apenas uma linha por SKU?\n\nOK = somar quantidades  |  Cancelar = manter repetidos";
    if (confirm(msg)) {
      const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
      const somas = {}, ordem = [];
      for (const [sku, qtd] of itens) {
        if (!(sku in somas)) { somas[sku] = 0; ordem.push(sku); }
        somas[sku] += num(qtd);
      }
      itens = ordem.map(sku => [sku, String(somas[sku] % 1 === 0 ? somas[sku] : somas[sku].toFixed(2).replace(".", ","))]);
    }
  }

  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML = "";
  linhasTxt = [];
  let encontrados = 0, naoEncontrados = [];

  for (const [sku, qtd] of itens) {
    const soft = mapa[sku];
    const tr = document.createElement("tr");
    if (soft) {
      encontrados++;
      linhasTxt.push("2|||" + qtd + "|PRECO||||" + soft);
      tr.innerHTML = "<td>" + (encontrados + naoEncontrados.length) + "</td><td>" + sku + "</td><td>" + qtd + "</td><td><b>" + soft + "</b></td>";
    } else {
      naoEncontrados.push(sku);
      tr.className = "nf";
      tr.innerHTML = "<td>" + (encontrados + naoEncontrados.length) + "</td><td>" + sku + "</td><td>" + qtd + "</td><td>NÃO ENCONTRADO</td>";
    }
    tbody.appendChild(tr);
  }

  document.getElementById("resumo").textContent = encontrados + " encontrados / " + naoEncontrados.length + " não encontrados";
  document.getElementById("avisoNF").textContent = naoEncontrados.length
    ? "Atenção: os SKUs não encontrados NÃO entram no TXT: " + naoEncontrados.join(", ")
    : "";
  document.getElementById("cardResultado").classList.remove("hidden");
  atualizarPreview();
  document.getElementById("cardTxt").classList.remove("hidden");
});

function cnpjLimpo() {
  return document.getElementById("cnpj").value.replace(/\D/g, "");
}

function conteudoTxt() {
  return "1||" + cnpjLimpo() + "\n" + linhasTxt.join("\n");
}

function atualizarPreview() {
  document.getElementById("preview").textContent = conteudoTxt();
}
document.getElementById("cnpj").addEventListener("input", () => { if (linhasTxt.length) atualizarPreview(); });

document.getElementById("btnGerar").addEventListener("click", () => {
  if (!linhasTxt.length) { alert("Processe um arquivo primeiro."); return; }
  if (cnpjLimpo().length !== 14) {
    if (!confirm("O CNPJ não tem 14 dígitos. Gerar o TXT mesmo assim?")) return;
  }
  let nome = document.getElementById("nomeArquivo").value.trim() || "pedido";
  if (!nome.toLowerCase().endsWith(".txt")) nome += ".txt";
  const blob = new Blob([conteudoTxt()], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
